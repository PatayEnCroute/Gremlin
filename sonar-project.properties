# Configuration SonarQube — Gremlin
sonar.projectKey=patayencroute
sonar.projectName=Gremlin
sonar.projectVersion=0.1.0

# Répertoires sources et exclusions
sonar.sources=crates
sonar.exclusions=**/target/**,**/assets/**,PictureBank/**,Icon/**,**/tests/**,**/*_test.rs,**/examples/**

# Tests et couverture de code
sonar.tests=crates
sonar.test.inclusions=**/tests/**,**/*_test.rs,**/test_*.rs

# Encodage & Rapports de couverture
sonar.sourceEncoding=UTF-8
sonar.coverageReportPaths=cobertura.xml
