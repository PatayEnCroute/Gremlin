# Organisation SonarCloud
sonar.organization=patayencroute

# Configuration SonarQube — Gremlin
sonar.projectKey=PatayEnCroute_Gremlin
sonar.projectName=Gremlin
sonar.projectVersion=0.1.0

# Répertoires sources et exclusions
sonar.sources=crates
sonar.exclusions=**/target/**,**/assets/**,PictureBank/**,Icon/**,**/tests/**,**/*_test.rs,**/examples/**

# Tests et couverture de code
sonar.tests=crates
sonar.test.inclusions=**/tests/**,**/*_test.rs,**/test_*.rs

# Encodage & Rapports de couverture
sonar.sourceEncoding=UTF-8
# `sonar.coverageReportPaths` attend le format XML « Generic Coverage » propre à
# Sonar. cargo-tarpaulin produit du Cobertura : le parseur générique échouait et
# faisait tomber toute l'analyse (exit code 3). L'analyseur Rust sait lire le
# Cobertura nativement via cette propriété dédiée.
sonar.rust.cobertura.reportPaths=cobertura.xml
