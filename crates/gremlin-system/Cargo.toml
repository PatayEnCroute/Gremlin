# Le mode click-through passe par `winit::Window::set_cursor_hittest` (portable
# Windows / macOS / X11). Deux besoins gardent malgré tout de la FFI Win32 : la
# clé de registre `Run` de l'autostart, et la présentation en couches du
# familier — la seule voie, sous Windows, pour une transparence par pixel réelle
# (voir `platform::layered`).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[lints]
workspace = true
