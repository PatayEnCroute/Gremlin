[package]
name = "gremlin-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Caisse binaire : produit final distribué sous forme d'exécutable, jamais
# publié sur crates.io. L'indiquer explicitement évite un `cargo publish`
# accidentel et autorise les dépendances `path` sans version (voir
# `allow-wildcard-paths` dans `deny.toml`).
publish = false

[lib]
name = "gremlin_app"
path = "src/lib.rs"

[[bin]]
name = "gremlin"
path = "src/main.rs"

[features]
default = ["a11y"]
# Expose l'arbre d'accessibilité du panneau de paramètres à l'OS, ce qui rend
# l'interface utilisable au lecteur d'écran. Isolée derrière une feature pour
# pouvoir produire un binaire sans la pile UI Automation / AT-SPI.
a11y = ["dep:accesskit", "dep:accesskit_winit"]

[dependencies]
gremlin-core.workspace = true
gremlin-watcher.workspace = true
gremlin-render.workspace = true
gremlin-system.workspace = true

thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel.workspace = true
winit.workspace = true
pixels.workspace = true
softbuffer.workspace = true
image.workspace = true

accesskit = { workspace = true, optional = true }
accesskit_winit = { workspace = true, optional = true }

# La pile d'accessibilité Unix (AT-SPI par D-Bus, et sa boucle asynchrone) n'a
# de sens que sur Linux et les BSD. L'activer par cible évite de la traîner
# dans le graphe de dépendances de Windows et de macOS, qui disposent d'un
# adaptateur natif.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
accesskit_winit = { workspace = true, optional = true, features = [
    "accesskit_unix",
    "async-io",
] }

# Utilise uniquement par l'exemple de diagnostic `probe_surface_alpha`, qui doit
# attendre la resolution d'un adaptateur graphique. Deja present dans le graphe
# via `pixels`, cette declaration n'ajoute donc aucune caisse.
[dev-dependencies]
pollster = "0.3"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[lints]
workspace = true
