name: CI — Validation Multi-Plateformes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Formatage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt

      - name: Check code formatting
        run: cargo fmt --all -- --check

  lint:
    # Clippy tourne sur les trois systèmes : le code sous `#[cfg(windows)]`
    # ou `#[cfg(target_os = "macos")]` n'était jamais analysé auparavant.
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libayatana-appindicator3-dev libgtk-3-dev libasound2-dev

      - name: Install Rust toolchain
        # Version épinglée : avec pedantic + nursery promus en erreurs, une
        # nouvelle version stable de Clippy pouvait faire rougir `main` du jour
        # au lendemain sans le moindre changement de code.
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Strict static analysis (Clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libayatana-appindicator3-dev libgtk-3-dev libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run all workspace tests
        run: cargo test --workspace --verbose

      - name: Verify the tree is unchanged by the test run
        # Un test qui écrivait dans `assets/` se faisait passer pour un test
        # unitaire : cette garde empêche la récidive.
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::La suite de tests a modifié l'arbre de travail :"
            git status --porcelain
            exit 1
          fi

  supply-chain:
    name: Vulnérabilités & Licences
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Run cargo-deny (advisories, licences, sources, doublons)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libayatana-appindicator3-dev libgtk-3-dev libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build the API documentation
        run: cargo doc --workspace --no-deps --document-private-items
