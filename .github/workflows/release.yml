name: Release — Compilation & Distribution Native

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: gremlin-windows-x86_64.zip
            bin_name: gremlin.exe
            native: true
          - os: macos-13
            # Exécuteur Intel : la cible x86_64 est ainsi compilée *et testée*
            # nativement, au lieu d'être croisée depuis un runner ARM et
            # publiée sans avoir jamais été exécutée.
            target: x86_64-apple-darwin
            artifact_name: gremlin-macos-x86_64.tar.gz
            bin_name: gremlin
            native: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: gremlin-macos-aarch64.tar.gz
            bin_name: gremlin
            native: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: gremlin-linux-x86_64.tar.gz
            bin_name: gremlin
            native: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libayatana-appindicator3-dev libgtk-3-dev libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run the test suite for this target
        # Aucun binaire n'est publié sans que sa suite de tests soit passée sur
        # la plateforme exacte qui l'exécutera.
        if: matrix.native
        run: cargo test --workspace --release --target ${{ matrix.target }}

      - name: Compile optimized release binary
        run: cargo build --release --target ${{ matrix.target }} -p gremlin-app

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # L'archive contient un dossier racine `gremlin/` : extraire une
          # archive « en vrac » polluait le répertoire courant.
          New-Item -ItemType Directory -Force -Path dist/gremlin | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/gremlin/
          Copy-Item -Recurse assets dist/gremlin/
          Copy-Item README.md, LICENSE -Destination dist/gremlin/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/gremlin -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Unix Artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/gremlin
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/gremlin/
          cp -r assets dist/gremlin/
          cp README.md dist/gremlin/ 2>/dev/null || true
          cp LICENSE dist/gremlin/ 2>/dev/null || true
          # `-C dist gremlin` conserve le dossier racine dans l'archive.
          tar -czf ${{ matrix.artifact_name }} -C dist gremlin

      - name: Generate checksum
        # Produit dès l'étape de build : les exécutions `workflow_dispatch`
        # livraient auparavant des artefacts sans somme de contrôle.
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          fi
          cat "${{ matrix.artifact_name }}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          cd release-artifacts
          cat ./*.sha256 > SHA256SUMS.txt
          rm -f ./*.sha256
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          body: |
            ## Vérification des binaires

            Les sommes de contrôle SHA-256 sont publiées dans `SHA256SUMS.txt`.

            > **Binaires non signés.** Ce projet ne dispose pas encore de
            > certificat de signature de code. macOS (Gatekeeper) et Windows
            > (SmartScreen) afficheront donc un avertissement au premier
            > lancement. Vérifiez la somme de contrôle avant d'exécuter le
            > binaire téléchargé.
